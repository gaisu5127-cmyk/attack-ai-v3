<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATTACK AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-zinc-950 text-white font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- Auth Section (หน้าล็อกอิน) -->
    <div id="authScreen" class="fixed inset-0 bg-zinc-950 z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-md">
            <h1 class="text-2xl font-bold text-center mb-6 text-sky-400">ATTACK AI</h1>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-zinc-400 mb-1">ชื่อผู้ใช้</label>
                    <input type="text" id="usernameInput" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-sm text-zinc-400 mb-1">รหัสผ่าน</label>
                    <input type="password" id="passwordInput" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
                </div>
                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold p-2.5 rounded-lg transition-colors">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="flex h-full relative">
        <!-- Sidebar Backdrop (Mobile) -->
        <div id="sidebarBackdrop" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

        <!-- Sidebar (แถบข้าง) -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-zinc-900 border-r border-zinc-800 z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-200 flex flex-col justify-between">
            <div class="p-4 flex-1 flex flex-col overflow-hidden">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-sky-400">ATTACK AI</h2>
                    <button id="closeSidebarBtn" class="md:hidden text-zinc-400 hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <!-- Recents List (ประวัติการแชท) -->
                <div class="text-xs font-semibold text-zinc-500 uppercase mb-2">Recents</div>
                <div id="recentsContainer" class="flex-1 overflow-y-auto space-y-1 pr-1">
                    <!-- รายการประวัติแชทจะถูกสร้างด้วย JS ที่นี่ -->
                </div>

                <button id="newChatBtn" class="mt-4 w-full border border-zinc-700 hover:bg-zinc-800 text-white py-2 px-4 rounded-xl flex items-center justify-center gap-2 transition">
                    <span>+ New chat</span>
                </button>
            </div>

            <!-- Profile Bottom Bar -->
            <div class="p-4 border-t border-zinc-800 flex items-center justify-between">
                <div id="openProfileBtn" class="flex items-center gap-3 cursor-pointer hover:opacity-80">
                    <img id="userAvatar" src="https://via.placeholder.com/40" class="w-10 h-10 rounded-full object-cover">
                    <span id="displayUsername" class="font-medium truncate max-w-[100px]">User</span>
                </div>
                <button id="logoutBtn" class="text-xs text-zinc-400 hover:text-red-400">Logout</button>
            </div>
        </aside>

        <!-- Main Content (ส่วนแชทหลัก) -->
        <main class="flex-1 flex flex-col h-full bg-zinc-950 min-w-0">
            <!-- Header (Mobile Top Bar) -->
            <header class="md:hidden border-b border-zinc-800 p-4 flex items-center justify-between">
                <button id="openSidebarBtn" class="text-zinc-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="text-lg font-bold text-sky-400">ATTACK AI</h1>
                <div class="w-6"></div>
            </header>

            <!-- Chat Area (พื้นที่แสดงข้อความ) -->
            <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
                <div id="emptyState" class="h-full flex items-center justify-center text-zinc-600">
                    <p>เริ่มต้นพิมพ์ข้อความเพื่อสนทนากับ ATTACK AI</p>
                </div>
            </div>

            <!-- Input Form (กล่องพิมพ์ข้อความ) -->
            <div class="p-4 border-t border-zinc-800/50">
                <form id="chatForm" class="max-w-3xl mx-auto relative flex items-center">
                    <input type="text" id="userInput" placeholder="ถามคำถามหรือสั่งงานที่นี่..." class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl py-3 pl-4 pr-12 text-white focus:outline-none focus:border-sky-500">
                    <button type="submit" id="sendBtn" class="absolute right-2 p-2 bg-sky-500 hover:bg-sky-600 text-white rounded-xl transition-colors flex items-center justify-center">
                        <svg id="sendIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                        <!-- Loading Spinner -->
                        <svg id="loadingSpinner" class="w-5 h-5 animate-spin hidden" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-sm">
            <h3 class="text-lg font-bold mb-4">แก้ไขโปรไฟล์</h3>
            <div class="space-y-4">
                <div class="flex flex-col items-center gap-2">
                    <img id="modalAvatarPreview" src="https://via.placeholder.com/80" class="w-20 h-20 rounded-full object-cover border-2 border-sky-500">
                    <input type="text" id="avatarUrlInput" placeholder="URL รูปโปรไฟล์" class="w-full text-xs bg-zinc-800 border border-zinc-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">ชื่อผู้ใช้</label>
                    <input type="text" id="modalUsernameInput" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-white text-sm">
                </div>
                <div class="flex gap-2 pt-2">
                    <button id="closeProfileBtn" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white py-2 rounded-lg text-sm">ยกเลิก</button>
                    <button id="saveProfileBtn" class="flex-1 bg-sky-500 hover:bg-sky-600 text-white py-2 rounded-lg text-sm font-semibold">บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Zone -->
    <script>
        // State
        let currentUser = null;
        let chatHistory = {}; // Structure: { chatId: { title: "", messages: [{sender: "", text: ""}] } }
        let currentChatId = null;

        // Elements
        const authScreen = document.getElementById('authScreen');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('usernameInput');
        const displayUsername = document.getElementById('displayUsername');
        const userAvatar = document.getElementById('userAvatar');
        const logoutBtn = document.getElementById('logoutBtn');

        const sidebar = document.getElementById('sidebar');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');

        const recentsContainer = document.getElementById('recentsContainer');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatContainer = document.getElementById('chatContainer');
        const emptyState = document.getElementById('emptyState');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendIcon = document.getElementById('sendIcon');
        const loadingSpinner = document.getElementById('loadingSpinner');

        const profileModal = document.getElementById('profileModal');
        const openProfileBtn = document.getElementById('openProfileBtn');
        const closeProfileBtn = document.getElementById('closeProfileBtn');
        const saveProfileBtn = document.getElementById('saveProfileBtn');
        const avatarUrlInput = document.getElementById('avatarUrlInput');
        const modalAvatarPreview = document.getElementById('modalAvatarPreview');
        const modalUsernameInput = document.getElementById('modalUsernameInput');

        // Init App
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('attack_ai_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                initUserData();
                authScreen.classList.add('hidden');
            }

            // Marked option setup
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                }
            });
        });

        // Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            if (!username) return;

            currentUser = {
                username: username,
                avatar: 'https://via.placeholder.com/40'
            };

            localStorage.setItem('attack_ai_user', JSON.stringify(currentUser));
            initUserData();
            authScreen.classList.add('hidden');
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('attack_ai_user');
            location.reload();
        });

        function initUserData() {
            displayUsername.textContent = currentUser.username;
            userAvatar.src = currentUser.avatar || 'https://via.placeholder.com/40';
            
            // Load Chat History
            const historyKey = `attack_ai_history_${currentUser.username}`;
            chatHistory = JSON.parse(localStorage.getItem(historyKey)) || {};
            renderRecents();
        }

        // Render Recents Sidebar
        function renderRecents() {
            recentsContainer.innerHTML = '';
            const chatIds = Object.keys(chatHistory).reverse(); // ล่าสุดอยู่บน

            chatIds.forEach(id => {
                const item = chatHistory[id];
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2 rounded-xl text-sm truncate transition ${id === currentChatId ? 'bg-zinc-800 text-white font-medium' : 'text-zinc-400 hover:bg-zinc-800/50 hover:text-white'}`;
                btn.textContent = item.title || 'แชทไม่มีชื่อ';
                
                btn.addEventListener('click', () => {
                    loadChat(id);
                    closeSidebar();
                });

                recentsContainer.appendChild(btn);
            });
        }

        // Load Single Chat
        function loadChat(chatId) {
            currentChatId = chatId;
            renderRecents();
            
            chatContainer.innerHTML = '';
            const messages = chatHistory[chatId]?.messages || [];

            if (messages.length === 0) {
                chatContainer.appendChild(emptyState);
                return;
            }

            messages.forEach(msg => {
                appendMessageUI(msg.sender, msg.text);
            });

            scrollToBottom();
        }

        // New Chat
        newChatBtn.addEventListener('click', () => {
            currentChatId = null;
            renderRecents();
            chatContainer.innerHTML = '';
            chatContainer.appendChild(emptyState);
            closeSidebar();
        });

        // Handle Send Message
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            if (!currentChatId) {
                currentChatId = 'chat_' + Date.now();
                chatHistory[currentChatId] = {
                    title: text.substring(0, 24),
                    messages: []
                };
            }

            // Remove empty state
            if (chatContainer.contains(emptyState)) {
                chatContainer.removeChild(emptyState);
            }

            // User Message
            appendMessageUI('user', text);
            saveMessage('user', text);
            userInput.value = '';

            // Loading state
            setLoading(true);

            try {
                // Fetch from Backend API
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory[currentChatId].messages })
                });

                const data = await res.json();
                const aiReply = data.reply || data.message || "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์";

                appendMessageUI('ai', aiReply);
                saveMessage('ai', aiReply);
            } catch (err) {
                const errorMsg = "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้";
                appendMessageUI('ai', errorMsg);
                saveMessage('ai', errorMsg);
            } finally {
                setLoading(false);
            }
        });

        function saveMessage(sender, text) {
            chatHistory[currentChatId].messages.push({ sender, text });
            const historyKey = `attack_ai_history_${currentUser.username}`;
            localStorage.setItem(historyKey, JSON.stringify(chatHistory));
            renderRecents();
        }

        function appendMessageUI(sender, text) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} mb-4`;

            const box = document.createElement('div');
            box.className = `max-w-[85%] rounded-2xl p-4 ${isUser ? 'bg-sky-600 text-white rounded-br-none' : 'bg-zinc-900 border border-zinc-800 text-zinc-100 rounded-bl-none'}`;

            if (isUser) {
                box.textContent = text;
            } else {
                box.innerHTML = marked.parse(text);
                // Highlight code blocks
                box.querySelectorAll('pre code').forEach((el) => {
                    hljs.highlightElement(el);
                });
            }

            wrapper.appendChild(box);
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function setLoading(isLoading) {
            if (isLoading) {
                sendIcon.classList.add('hidden');
                loadingSpinner.classList.remove('hidden');
            } else {
                sendIcon.classList.remove('hidden');
                loadingSpinner.classList.add('hidden');
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Sidebar Control (Mobile)
        openSidebarBtn?.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
            sidebarBackdrop.classList.remove('hidden');
        });

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarBackdrop.classList.add('hidden');
        }

        closeSidebarBtn?.addEventListener('click', closeSidebar);
        sidebarBackdrop?.addEventListener('click', closeSidebar);

        // Profile Modal Control
        openProfileBtn.addEventListener('click', () => {
            modalUsernameInput.value = currentUser.username;
            avatarUrlInput.value = currentUser.avatar || '';
            modalAvatarPreview.src = currentUser.avatar || 'https://via.placeholder.com/80';
            profileModal.classList.remove('hidden');
        });

        closeProfileBtn.addEventListener('click', () => {
            profileModal.classList.add('hidden');
        });

        avatarUrlInput.addEventListener('input', (e) => {
            modalAvatarPreview.src = e.target.value || 'https://via.placeholder.com/80';
        });

        saveProfileBtn.addEventListener('click', () => {
            const newName = modalUsernameInput.value.trim();
            const newAvatar = avatarUrlInput.value.trim();

            if (newName) {
                currentUser.username = newName;
                currentUser.avatar = newAvatar;
                localStorage.setItem('attack_ai_user', JSON.stringify(currentUser));
                initUserData();
                profileModal.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
