<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATTACK AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        claude: {
                            bg: '#181816',
                            sidebar: '#1E1E1C',
                            border: '#2E2E2A',
                            hover: '#2A2A26',
                            card: '#22221F',
                            accent: '#D97706', // โทนส้ม Amber
                            accentHover: '#B45309',
                            text: '#ECEBE4',
                            subtext: '#8E8D8A'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        /* Custom Scrollbar สไตล์ Claude */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2E2E2A; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3E3E3A; }
    </style>
</head>
<body class="bg-claude-bg text-claude-text font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- Auth Screen (หน้าเข้าสู่ระบบ) -->
    <div id="authScreen" class="fixed inset-0 bg-claude-bg z-50 flex items-center justify-center p-4">
        <div class="bg-claude-sidebar border border-claude-border p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="flex items-center justify-center gap-2 mb-6">
                <span class="text-2xl font-bold text-claude-accent">▲</span>
                <h1 class="text-2xl font-bold text-claude-text tracking-wider">ATTACK AI</h1>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-claude-subtext mb-1 uppercase tracking-wider">ชื่อผู้ใช้</label>
                    <input type="text" id="usernameInput" required class="w-full bg-claude-bg border border-claude-border rounded-xl p-3 text-claude-text focus:outline-none focus:border-claude-accent transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-claude-subtext mb-1 uppercase tracking-wider">รหัสผ่าน</label>
                    <input type="password" id="passwordInput" required class="w-full bg-claude-bg border border-claude-border rounded-xl p-3 text-claude-text focus:outline-none focus:border-claude-accent transition">
                </div>
                <button type="submit" class="w-full bg-claude-accent hover:bg-claude-accentHover text-white font-medium p-3 rounded-xl transition shadow-lg mt-2">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- Main Container -->
    <div class="flex h-full relative">
        <!-- Sidebar Backdrop (Mobile) -->
        <div id="sidebarBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 hidden md:hidden"></div>

        <!-- Sidebar (Claude Style) -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-claude-sidebar border-r border-claude-border z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-200 flex flex-col justify-between">
            <div class="p-4 flex-1 flex flex-col overflow-hidden">
                <!-- Header Sidebar -->
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <span class="text-claude-accent text-xl font-bold">▲</span>
                        <span class="font-bold tracking-wider text-claude-text">ATTACK AI</span>
                    </div>
                    <button id="closeSidebarBtn" class="md:hidden text-claude-subtext hover:text-claude-text p-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <!-- New Chat Button -->
                <button id="newChatBtn" class="w-full bg-claude-hover border border-claude-border hover:bg-claude-border text-claude-text py-2.5 px-4 rounded-xl flex items-center justify-start gap-3 transition mb-6 text-sm">
                    <span class="text-claude-accent text-lg">+</span>
                    <span>Start new chat</span>
                </button>

                <!-- Recents List Header -->
                <div class="text-[11px] font-semibold text-claude-subtext uppercase tracking-wider mb-2 px-1">Recents</div>
                
                <!-- Recents Container -->
                <div id="recentsContainer" class="flex-1 overflow-y-auto space-y-1 pr-1">
                    <!-- รายการจะถูกแทรกที่นี่โดย JavaScript -->
                </div>
            </div>

            <!-- User Profile Bottom Bar -->
            <div class="p-4 border-t border-claude-border flex items-center justify-between bg-claude-sidebar">
                <div id="openProfileBtn" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition flex-1 min-w-0 pr-2">
                    <img id="userAvatar" src="https://via.placeholder.com/40" class="w-8 h-8 rounded-full object-cover border border-claude-border">
                    <span id="displayUsername" class="font-medium text-sm truncate text-claude-text">User</span>
                </div>
                <button id="logoutBtn" class="text-xs text-claude-subtext hover:text-red-400 transition">Logout</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col h-full bg-claude-bg min-w-0">
            <!-- Mobile Header -->
            <header class="md:hidden border-b border-claude-border p-4 flex items-center justify-between bg-claude-sidebar">
                <button id="openSidebarBtn" class="text-claude-subtext hover:text-claude-text">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center gap-2">
                    <span class="text-claude-accent font-bold">▲</span>
                    <span class="font-bold text-claude-text">ATTACK AI</span>
                </div>
                <div class="w-6"></div>
            </header>

            <!-- Chat Messages Container -->
            <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-3xl w-full mx-auto">
                <div id="emptyState" class="h-full flex flex-col items-center justify-center text-claude-subtext text-center gap-3">
                    <span class="text-claude-accent text-4xl">▲</span>
                    <h2 class="text-xl font-medium text-claude-text">ยินดีต้อนรับสู่ ATTACK AI</h2>
                    <p class="text-sm max-w-sm">เริ่มต้นสอบถาม เขียนโค้ด หรือให้ช่วยวิเคราะห์ข้อมูลได้ทันที</p>
                </div>
            </div>

            <!-- Input Box Section -->
            <div class="p-4 md:p-6 border-t border-claude-border/50 bg-claude-bg">
                <form id="chatForm" class="max-w-3xl mx-auto relative">
                    <div class="relative flex items-center bg-claude-card border border-claude-border rounded-2xl shadow-lg focus-within:border-claude-accent transition">
                        <textarea id="userInput" rows="1" placeholder="Reply to ATTACK AI..." class="w-full bg-transparent py-3.5 pl-4 pr-12 text-claude-text placeholder-claude-subtext resize-none focus:outline-none max-h-32 text-sm leading-relaxed"></textarea>
                        <button type="submit" id="sendBtn" class="absolute right-2.5 p-2 bg-claude-accent hover:bg-claude-accentHover text-white rounded-xl transition flex items-center justify-center">
                            <svg id="sendIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                            <!-- Loading Spinner -->
                            <svg id="loadingSpinner" class="w-4 h-4 animate-spin hidden" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-claude-sidebar border border-claude-border p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-semibold mb-4 text-claude-text">แก้ไขโปรไฟล์</h3>
            <div class="space-y-4">
                <div class="flex flex-col items-center gap-3">
                    <img id="modalAvatarPreview" src="https://via.placeholder.com/80" class="w-20 h-20 rounded-full object-cover border-2 border-claude-accent">
                    <input type="text" id="avatarUrlInput" placeholder="URL รูปโปรไฟล์ (https://...)" class="w-full text-xs bg-claude-bg border border-claude-border rounded-xl p-2.5 text-claude-text focus:outline-none focus:border-claude-accent">
                </div>
                <div>
                    <label class="block text-xs font-medium text-claude-subtext mb-1">ชื่อผู้ใช้</label>
                    <input type="text" id="modalUsernameInput" class="w-full bg-claude-bg border border-claude-border rounded-xl p-2.5 text-claude-text text-sm focus:outline-none focus:border-claude-accent">
                </div>
                <div class="flex gap-2 pt-2">
                    <button id="closeProfileBtn" class="flex-1 bg-claude-card hover:bg-claude-border text-claude-text py-2.5 rounded-xl text-sm transition">ยกเลิก</button>
                    <button id="saveProfileBtn" class="flex-1 bg-claude-accent hover:bg-claude-accentHover text-white py-2.5 rounded-xl text-sm font-medium transition shadow">บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentUser = null;
        let chatHistory = {}; // { chatId: { id: "", title: "", messages: [{sender: "", text: ""}] } }
        let currentChatId = null;

        // Elements
        const authScreen = document.getElementById('authScreen');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('usernameInput');
        const displayUsername = document.getElementById('displayUsername');
        const userAvatar = document.getElementById('userAvatar');
        const logoutBtn = document.getElementById('logoutBtn');

        const sidebar = document.getElementById('sidebar');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');

        const recentsContainer = document.getElementById('recentsContainer');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatContainer = document.getElementById('chatContainer');
        const emptyState = document.getElementById('emptyState');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendIcon = document.getElementById('sendIcon');
        const loadingSpinner = document.getElementById('loadingSpinner');

        const profileModal = document.getElementById('profileModal');
        const openProfileBtn = document.getElementById('openProfileBtn');
        const closeProfileBtn = document.getElementById('closeProfileBtn');
        const saveProfileBtn = document.getElementById('saveProfileBtn');
        const avatarUrlInput = document.getElementById('avatarUrlInput');
        const modalAvatarPreview = document.getElementById('modalAvatarPreview');
        const modalUsernameInput = document.getElementById('modalUsernameInput');

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('attack_ai_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                initUserData();
                authScreen.classList.add('hidden');
            }

            // Markdown Highlight Options
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                }
            });

            // Auto-resize Textarea
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
        });

        // Auth
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            if (!username) return;

            currentUser = { username, avatar: 'https://via.placeholder.com/40' };
            localStorage.setItem('attack_ai_user', JSON.stringify(currentUser));
            initUserData();
            authScreen.classList.add('hidden');
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('attack_ai_user');
            location.reload();
        });

        function initUserData() {
            displayUsername.textContent = currentUser.username;
            userAvatar.src = currentUser.avatar || 'https://via.placeholder.com/40';
            
            const historyKey = `attack_ai_history_${currentUser.username}`;
            chatHistory = JSON.parse(localStorage.getItem(historyKey)) || {};
            renderRecents();
        }

        // Render Recents List (Claude UI Style)
        function renderRecents() {
            recentsContainer.innerHTML = '';
            const chatIds = Object.keys(chatHistory).reverse();

            chatIds.forEach(id => {
                const item = chatHistory[id];
                const btn = document.createElement('button');
                
                // สไตล์ปุ่ม Recents ให้แมตช์กับ Claude UI
                const isActive = id === currentChatId;
                btn.className = `w-full text-left px-3 py-2 rounded-xl text-xs truncate transition block ${
                    isActive 
                        ? 'bg-claude-hover text-claude-text font-medium border border-claude-border' 
                        : 'text-claude-subtext hover:bg-claude-hover/50 hover:text-claude-text'
                }`;
                btn.textContent = item.title || 'Untitled Chat';
                
                btn.addEventListener('click', () => {
                    loadChat(id);
                    closeSidebar();
                });

                recentsContainer.appendChild(btn);
            });
        }

        // Load Selected Chat History
        function loadChat(chatId) {
            currentChatId = chatId;
            renderRecents();
            
            chatContainer.innerHTML = '';
            const messages = chatHistory[chatId]?.messages || [];

            if (messages.length === 0) {
                chatContainer.appendChild(emptyState);
                return;
            }

            messages.forEach(msg => {
                appendMessageUI(msg.sender, msg.text);
            });

            scrollToBottom();
        }

        // New Chat Button
        newChatBtn.addEventListener('click', () => {
            currentChatId = null;
            renderRecents();
            chatContainer.innerHTML = '';
            chatContainer.appendChild(emptyState);
            userInput.value = '';
            userInput.style.height = 'auto';
            closeSidebar();
        });

        // Submit Form (Send Msg)
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            if (!currentChatId) {
                currentChatId = 'chat_' + Date.now();
                chatHistory[currentChatId] = {
                    id: currentChatId,
                    title: text.substring(0, 26) + (text.length > 26 ? '...' : ''),
                    messages: []
                };
            }

            if (chatContainer.contains(emptyState)) {
                chatContainer.removeChild(emptyState);
            }

            // Append User Msg
            appendMessageUI('user', text);
            saveMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            setLoading(true);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory[currentChatId].messages })
                });

                const data = await res.json();
                const aiReply = data.reply || data.message || "เกิดข้อผิดพลาดจากระบบเซิร์ฟเวอร์";

                appendMessageUI('ai', aiReply);
                saveMessage('ai', aiReply);
            } catch (err) {
                const errorMsg = "ไม่สามารถติดต่อกับเซิร์ฟเวอร์ได้";
                appendMessageUI('ai', errorMsg);
                saveMessage('ai', errorMsg);
            } finally {
                setLoading(false);
            }
        });

        function saveMessage(sender, text) {
            chatHistory[currentChatId].messages.push({ sender, text });
            const historyKey = `attack_ai_history_${currentUser.username}`;
            localStorage.setItem(historyKey, JSON.stringify(chatHistory));
            renderRecents();
        }

        // Display Message UI (Claude Style)
        function appendMessageUI(sender, text) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} mb-4`;

            const box = document.createElement('div');
            box.className = `max-w-[88%] text-sm leading-relaxed p-4 rounded-2xl ${
                isUser 
                    ? 'bg-claude-card border border-claude-border text-claude-text rounded-tr-none' 
                    : 'bg-transparent text-claude-text pl-0'
            }`;

            if (isUser) {
                box.textContent = text;
            } else {
                box.innerHTML = marked.parse(text);
                box.querySelectorAll('pre code').forEach((el) => {
                    hljs.highlightElement(el);
                });
            }

            wrapper.appendChild(box);
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function setLoading(isLoading) {
            if (isLoading) {
                sendIcon.classList.add('hidden');
                loadingSpinner.classList.remove('hidden');
            } else {
                sendIcon.classList.remove('hidden');
                loadingSpinner.classList.add('hidden');
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Sidebar Control
        openSidebarBtn?.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
            sidebarBackdrop.classList.remove('hidden');
        });

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarBackdrop.classList.add('hidden');
        }

        closeSidebarBtn?.addEventListener('click', closeSidebar);
        sidebarBackdrop?.addEventListener('click', closeSidebar);

        // Profile Modal
        openProfileBtn.addEventListener('click', () => {
            modalUsernameInput.value = currentUser.username;
            avatarUrlInput.value = currentUser.avatar || '';
            modalAvatarPreview.src = currentUser.avatar || 'https://via.placeholder.com/80';
            profileModal.classList.remove('hidden');
        });

        closeProfileBtn.addEventListener('click', () => {
            profileModal.classList.add('hidden');
        });

        avatarUrlInput.addEventListener('input', (e) => {
            modalAvatarPreview.src = e.target.value || 'https://via.placeholder.com/80';
        });

        saveProfileBtn.addEventListener('click', () => {
            const newName = modalUsernameInput.value.trim();
            const newAvatar = avatarUrlInput.value.trim();

            if (newName) {
                currentUser.username = newName;
                currentUser.avatar = newAvatar;
                localStorage.setItem('attack_ai_user', JSON.stringify(currentUser));
                initUserData();
                profileModal.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
