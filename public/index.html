<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACK AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        pre { position: relative; padding-top: 2.5rem !important; border-radius: 0.75rem !important; }
        .copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; background: #383532; color: #E1DED7; border-radius: 0.375rem; cursor: pointer; transition: 0.2s; }
        .copy-btn:hover { background: #4A4744; }
    </style>
</head>
<body class="bg-[#121110] text-[#E1DED7] h-screen flex overflow-hidden antialiased">

    <!-- หน้าต่างเข้าสู่ระบบบังคับ (Fullscreen Login Screen) -->
    <div id="loginScreen" class="fixed inset-0 bg-[#000000] z-50 flex items-center justify-center p-4">
        <div class="bg-[#181716] border border-[#2A2826] p-8 rounded-3xl max-w-sm w-full space-y-6 shadow-2xl text-center">
            <div class="flex justify-center">
                <svg class="w-20 h-20 text-white" viewBox="0 0 200 200" fill="none">
                    <path d="M100 30L165 150L135 150L100 80L65 150L35 150L100 30Z" fill="white"/>
                    <path d="M100 80L120 120L100 100L80 120L100 80Z" fill="#181716"/>
                    <path d="M45 80L25 95L45 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M155 80L175 95L155 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-white tracking-wider">ATTACK AI</h2>
                <p class="text-xs text-[#737068] mt-1">กรุณาล็อกอินเพื่อเริ่มใช้งานระบบ</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="text-xs text-[#9E9B93]">Username</label>
                    <input type="text" id="loginUser" required placeholder="กรอกชื่อผู้ใช้" class="w-full bg-[#121110] border border-[#33302D] p-3 rounded-xl text-sm text-white outline-none mt-1 focus:border-[#38BDF8] transition">
                </div>
                <div>
                    <label class="text-xs text-[#9E9B93]">Password</label>
                    <input type="password" id="loginPass" required placeholder="กรอกรหัสผ่าน" class="w-full bg-[#121110] border border-[#33302D] p-3 rounded-xl text-sm text-white outline-none mt-1 focus:border-[#38BDF8] transition">
                </div>
                <button type="submit" class="w-full py-3 bg-white text-black font-bold text-sm rounded-xl hover:bg-gray-200 transition mt-2">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Modal ตั้งค่าโปรไฟล์และบัญชี -->
    <div id="profileModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-[#181716] border border-[#2A2826] p-6 rounded-3xl max-w-sm w-full space-y-5 shadow-2xl text-left">
            <div class="flex justify-between items-center border-b border-[#2A2826] pb-3">
                <h3 class="text-lg font-bold text-white">ตั้งค่าโปรไฟล์ & บัญชี</h3>
                <button onclick="toggleProfileModal()" class="text-[#737068] hover:text-white">✕</button>
            </div>
            
            <div class="flex flex-col items-center gap-3">
                <div class="relative group cursor-pointer" onclick="document.getElementById('avatarInput').click()">
                    <div id="profileModalAvatar" class="w-20 h-20 rounded-full bg-[#262422] border-2 border-[#38BDF8] flex items-center justify-center font-bold text-white text-2xl overflow-hidden bg-cover bg-center">
                        U
                    </div>
                    <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-xs text-white">
                        เปลี่ยนรูป
                    </div>
                </div>
                <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="previewAvatar(event)">
                <span class="text-xs text-[#737068]">คลิกเพื่อเปลี่ยนรูปโปรไฟล์</span>
            </div>

            <form onsubmit="saveProfile(event)" class="space-y-4">
                <div>
                    <label class="text-xs text-[#9E9B93]">ชื่อผู้ใช้ (Display Name)</label>
                    <input type="text" id="editUserName" required class="w-full bg-[#121110] border border-[#33302D] p-2.5 rounded-xl text-sm text-white outline-none mt-1 focus:border-[#38BDF8] transition">
                </div>
                <div>
                    <label class="text-xs text-[#9E9B93]">เปลี่ยนรหัสผ่านใหม่ (ไม่เปลี่ยนให้เว้นว่าง)</label>
                    <input type="password" id="editUserPass" placeholder="รหัสผ่านใหม่" class="w-full bg-[#121110] border border-[#33302D] p-2.5 rounded-xl text-sm text-white outline-none mt-1 focus:border-[#38BDF8] transition">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 py-2.5 bg-[#38BDF8] text-black font-bold text-sm rounded-xl hover:opacity-90 transition">บันทึกข้อมูล</button>
                    <button type="button" onclick="toggleProfileModal()" class="px-4 py-2.5 bg-[#262422] text-[#C2BFB7] text-sm rounded-xl hover:text-white transition">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Sidebar & Main UI -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-20 hidden md:hidden"></div>

    <aside id="sidebar" class="w-72 bg-[#181716] border-r border-[#2A2826] flex flex-col justify-between transition-transform duration-300 z-30 fixed md:relative h-full -translate-x-full md:translate-x-0">
        <div class="p-5 space-y-6 overflow-y-auto no-scrollbar flex-1">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <svg class="w-7 h-7 text-white" viewBox="0 0 200 200" fill="none">
                        <path d="M100 30L165 150L135 150L100 80L65 150L35 150L100 30Z" fill="white"/>
                        <path d="M45 80L25 95L45 110" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M155 80L175 95L155 110" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h1 class="text-xl font-bold text-[#ECE9E3] tracking-wider">ATTACK AI</h1>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-[#9E9B93] hover:text-white">✕</button>
            </div>

            <nav class="space-y-3 font-medium text-sm text-[#C2BFB7]">
                <a href="#" class="flex items-center gap-3 py-1.5 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                    Chats
                </a>
                <a href="#" class="flex items-center gap-3 py-1.5 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                    Code
                </a>
            </nav>

            <div class="space-y-2 pt-2">
                <p class="text-xs font-semibold text-[#737068]">Recents</p>
                <div id="chatHistoryList" class="space-y-1"></div>
            </div>
        </div>

        <div class="p-4 space-y-3 bg-[#141312] border-t border-[#2A2826]">
            <button onclick="createNewChat()" class="w-full py-2.5 bg-[#262422] hover:bg-[#302D2A] text-[#ECE9E3] font-medium text-sm rounded-full border border-[#383532] flex items-center justify-center gap-2 transition shadow-lg">
                <span class="text-base font-light">+</span> New chat
            </button>
            <div id="userInfo" class="flex items-center justify-between pt-1">
                <div onclick="toggleProfileModal()" class="flex items-center gap-2.5 cursor-pointer hover:opacity-80 transition">
                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center font-bold text-black text-xs overflow-hidden bg-cover bg-center border border-[#38BDF8]" id="userAvatar">U</div>
                    <span class="text-xs font-medium text-[#ECE9E3] truncate max-w-[100px]" id="userName">User</span>
                </div>
                <button onclick="logout()" class="text-xs text-[#737068] hover:text-white">Logout</button>
            </div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-full relative">
        <header class="px-5 py-3 border-b border-[#2A2826] flex justify-between items-center bg-[#121110]">
            <button onclick="toggleSidebar()" class="text-[#9E9B93] hover:text-white md:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="ml-auto">
                <svg class="w-5 h-5 text-[#38BDF8]" viewBox="0 0 200 200" fill="none">
                    <path d="M100 30L165 150L135 150L100 80L65 150L35 150L100 30Z" fill="currentColor"/>
                </svg>
            </div>
        </header>

        <main id="chatBox" class="flex-1 px-4 overflow-y-auto no-scrollbar flex flex-col justify-center max-w-xl mx-auto w-full space-y-6 my-auto">
            <div id="welcomeScreen" class="text-center space-y-4 py-10 my-auto">
                <div class="flex justify-center">
                    <svg class="w-16 h-16 text-white" viewBox="0 0 200 200" fill="none">
                        <path d="M100 30L165 150L135 150L100 80L65 150L35 150L100 30Z" fill="white"/>
                        <path d="M45 80L25 95L45 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M155 80L175 95L155 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold tracking-wider text-[#ECE9E3]" id="welcomeText">
                    Welcome to ATTACK AI
                </h2>
            </div>
        </main>

        <footer class="p-4 bg-[#121110] max-w-xl mx-auto w-full space-y-3">
            <div class="bg-[#1C1B1A] border border-[#2A2826] rounded-2xl p-2.5 shadow-2xl space-y-2">
                <form id="chatForm" class="flex items-center gap-2">
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                    <button type="button" onclick="document.getElementById('imageInput').click()" class="w-9 h-9 flex items-center justify-center bg-[#262422] hover:bg-[#302D2A] text-[#E1DED7] rounded-full transition text-lg font-light">
                        +
                    </button>
                    <div class="relative flex-1">
                        <select id="mode" class="w-full appearance-none bg-[#262422] text-[#E1DED7] text-xs font-medium px-3 py-2 rounded-full border border-[#33302D] outline-none cursor-pointer pr-6">
                            <option value="normal">โหมดปกติ (เร็ว/ลุย)</option>
                            <option value="expert">โหมดผู้เชี่ยวชาญ (วิเคราะห์เจาะลึก)</option>
                            <option value="dumb">โหมดไอเอ๋อ (กวนๆ)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-9 h-9 flex items-center justify-center bg-[#ECE9E3] text-[#121110] hover:opacity-90 rounded-full transition">
                        ↑
                    </button>
                </form>
                <div class="px-1 pt-1">
                    <input type="text" id="userInput" placeholder="Chat with ATTACK AI..." class="w-full bg-transparent text-sm text-[#ECE9E3] outline-none placeholder-[#737068]">
                </div>
            </div>
        </footer>
    </div>

    <script>
        let chatHistory = [];
        try {
            chatHistory = JSON.parse(localStorage.getItem('attack_ai_history') || '[]');
        } catch(e) {
            chatHistory = [];
        }

        let currentChatId = String(Date.now());
        let lastUserMessage = '';
        let userAvatarData = localStorage.getItem('attack_ai_avatar') || '';

        marked.setOptions({
            highlight: function(code) { return hljs.highlightAuto(code).value; }
        });

        // โหลดและตรวจเช็กสถานะการเข้าสู่ระบบ
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('attack_ai_user');
            if (savedUser && savedUser.trim() !== '') {
                setUserData(savedUser, userAvatarData);
                hideLoginScreen();
            } else {
                showLoginScreen();
            }
            renderHistoryUI();
        });

        function showLoginScreen() {
            const el = document.getElementById('loginScreen');
            if (el) el.style.display = 'flex';
        }

        function hideLoginScreen() {
            const el = document.getElementById('loginScreen');
            if (el) el.style.display = 'none';
        }

        function setUserData(username, avatar) {
            document.getElementById('userName').innerText = username;
            document.getElementById('editUserName').value = username;
            const welcomeText = document.getElementById('welcomeText');
            if (welcomeText) welcomeText.innerText = `Welcome, ${username}`;
            
            const avatarEl = document.getElementById('userAvatar');
            const modalAvatarEl = document.getElementById('profileModalAvatar');

            if (avatar) {
                avatarEl.style.backgroundImage = `url(${avatar})`;
                avatarEl.innerText = '';
                modalAvatarEl.style.backgroundImage = `url(${avatar})`;
                modalAvatarEl.innerText = '';
            } else {
                avatarEl.style.backgroundImage = 'none';
                avatarEl.innerText = username[0] ? username[0].toUpperCase() : 'U';
                modalAvatarEl.style.backgroundImage = 'none';
                modalAvatarEl.innerText = username[0] ? username[0].toUpperCase() : 'U';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value.trim();
            if (username) {
                localStorage.setItem('attack_ai_user', username);
                setUserData(username, userAvatarData);
                hideLoginScreen();
            }
        }

        function logout() {
            localStorage.removeItem('attack_ai_user');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            showLoginScreen();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }

        function toggleProfileModal() {
            const modal = document.getElementById('profileModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        function previewAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    userAvatarData = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveProfile(e) {
            e.preventDefault();
            const newName = document.getElementById('editUserName').value.trim();
            if (newName) {
                localStorage.setItem('attack_ai_user', newName);
                if (userAvatarData) {
                    localStorage.setItem('attack_ai_avatar', userAvatarData);
                }
                setUserData(newName, userAvatarData);
                toggleProfileModal();
            }
        }

        function createNewChat() {
            currentChatId = String(Date.now());
            const chatBox = document.getElementById('chatBox');
            chatBox.classList.add('justify-center', 'my-auto');
            const currentUser = localStorage.getItem('attack_ai_user') || 'User';
            chatBox.innerHTML = `
                <div id="welcomeScreen" class="text-center space-y-4 py-10 my-auto">
                    <div class="flex justify-center">
                        <svg class="w-16 h-16 text-white" viewBox="0 0 200 200" fill="none">
                            <path d="M100 30L165 150L135 150L100 80L65 150L35 150L100 30Z" fill="white"/>
                            <path d="M45 80L25 95L45 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M155 80L175 95L155 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h2 class="text-3xl font-bold tracking-wider text-[#ECE9E3]" id="welcomeText">
                        Welcome, ${currentUser}
                    </h2>
                </div>`;
            renderHistoryUI();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function loadChat(chatId) {
            currentChatId = String(chatId);
            const chat = chatHistory.find(c => String(c.id) === currentChatId);
            if (!chat) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.classList.remove('justify-center', 'my-auto');
            chatBox.innerHTML = '';

            chat.messages.forEach(msg => {
                if (msg.sender === 'user') {
                    const userDiv = document.createElement('div');
                    userDiv.className = 'ml-auto bg-[#262422] text-[#ECE9E3] p-4 rounded-2xl max-w-[85%] text-sm border border-[#33302D] shadow';
                    userDiv.innerText = msg.text;
                    chatBox.appendChild(userDiv);
                } else {
                    const aiContainer = document.createElement('div');
                    aiContainer.className = 'mr-auto text-[#ECE9E3] p-2 max-w-[90%] text-sm space-y-2';
                    const aiTextDiv = document.createElement('div');
                    aiTextDiv.className = 'prose prose-invert';
                    aiTextDiv.innerHTML = marked.parse(msg.text);
                    aiContainer.appendChild(aiTextDiv);
                    aiContainer.innerHTML += createActionToolbar(msg.text);
                    chatBox.appendChild(aiContainer);
                }
            });

            hljs.highlightAll();
            chatBox.scrollTop = chatBox.scrollHeight;
            renderHistoryUI();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function renameChat(e, chatId) {
            e.stopPropagation();
            const chat = chatHistory.find(c => String(c.id) === String(chatId));
            if (!chat) return;
            const newTitle = prompt('ระบุชื่อแชทใหม่:', chat.title);
            if (newTitle && newTitle.trim() !== '') {
                chat.title = newTitle.trim();
                localStorage.setItem('attack_ai_history', JSON.stringify(chatHistory));
                renderHistoryUI();
            }
        }

        function deleteChat(e, chatId) {
            e.stopPropagation();
            if (confirm('คุณต้องการลบแชทนี้หรือไม่?')) {
                chatHistory = chatHistory.filter(c => String(c.id) !== String(chatId));
                localStorage.setItem('attack_ai_history', JSON.stringify(chatHistory));
                if (String(currentChatId) === String(chatId)) {
                    createNewChat();
                } else {
                    renderHistoryUI();
                }
            }
        }

        function createActionToolbar(textToCopy) {
            return `
            <div class="flex items-center gap-3 pt-3 text-[#8E8B82]">
                <button onclick="copyToClipboard('${encodeURIComponent(textToCopy)}')" title="Copy" class="hover:text-white transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                </button>
                <button onclick="shareResponse()" title="Share" class="hover:text-white transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                </button>
                <button onclick="speakText('${encodeURIComponent(textToCopy)}')" title="Read aloud" class="hover:text-white transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>
                <button onclick="this.classList.toggle('text-white')" title="Good response" class="hover:text-white transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 11H4a2 2 0 00-2 2v6a2 2 0 002 2h3"/></svg>
                </button>
                <button onclick="this.classList.toggle('text-white')" title="Bad response" class="hover:text-white transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018c.163 0 .326.02.485.06L17 4m-7 10v5a2 2 0 022 2h.095c.5 0 .905-.405.905-.905 0-.714-2.11 1.412-.608-2.006L17 13V4m-7 10h2m5-9h3a2 2 0 012 2v6a2 2 0 01-2 2h-3"/></svg>
                </button>
                <button onclick="retryLastMessage()" title="Retry response" class="hover:text-white transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                </button>
            </div>`;
        }

        function copyToClipboard(encodedText) {
            navigator.clipboard.writeText(decodeURIComponent(encodedText));
        }

        function speakText(encodedText) {
            const utterance = new SpeechSynthesisUtterance(decodeURIComponent(encodedText));
            window.speechSynthesis.speak(utterance);
        }

        function shareResponse() {
            if (navigator.share) navigator.share({ title: 'ATTACK AI Response', text: 'Check out this answer from ATTACK AI' });
        }

        function retryLastMessage() {
            if (lastUserMessage) {
                document.getElementById('userInput').value = lastUserMessage;
                document.getElementById('chatForm').dispatchEvent(new Event('submit'));
            }
        }

        function saveMessageToHistory(sender, text) {
            let chat = chatHistory.find(c => String(c.id) === String(currentChatId));
            if (!chat) {
                const cleanTitle = typeof text === 'string' ? text.trim().slice(0, 20) : 'New Chat';
                chat = { 
                    id: String(currentChatId), 
                    title: cleanTitle || 'New Chat',
                    messages: []
                };
                chatHistory.unshift(chat);
            }
            chat.messages.push({ sender, text });
            localStorage.setItem('attack_ai_history', JSON.stringify(chatHistory));
            renderHistoryUI();
        }

        function renderHistoryUI() {
            const list = document.getElementById('chatHistoryList');
            if (!list) return;

            list.innerHTML = chatHistory.map(c => {
                const isSelected = String(c.id) === String(currentChatId);
                const titleStr = String(c.title || 'New Chat');
                return `
                    <div onclick="loadChat('${c.id}')" class="group flex items-center justify-between p-2 text-sm rounded-lg hover:bg-[#262422] cursor-pointer ${isSelected ? 'bg-[#262422] text-white font-medium' : 'text-[#C2BFB7]'} hover:text-white transition">
                        <span class="truncate pr-2 flex-1">${titleStr}</span>
                        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                            <button onclick="renameChat(event, '${c.id}')" title="ตั้งชื่อใหม่" class="p-1 hover:text-[#38BDF8]">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button onclick="deleteChat(event, '${c.id}')" title="ลบห้อง" class="p-1 hover:text-red-400">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const fileInput = document.getElementById('imageInput');
            const mode = document.getElementById('mode').value;
            const chatBox = document.getElementById('chatBox');
            const welcomeScreen = document.getElementById('welcomeScreen');

            if (!input.value && !fileInput.files[0]) return;

            if (welcomeScreen) {
                welcomeScreen.remove();
                chatBox.classList.remove('justify-center', 'my-auto');
            }

            const userText = input.value;
            lastUserMessage = userText;
            saveMessageToHistory('user', userText || '[Image]');

            const userDiv = document.createElement('div');
            userDiv.className = 'ml-auto bg-[#262422] text-[#ECE9E3] p-4 rounded-2xl max-w-[85%] text-sm border border-[#33302D] shadow';
            userDiv.innerText = userText || '[Image]';
            chatBox.appendChild(userDiv);

            let imageBase64 = null, mimeType = null;
            if (fileInput.files[0]) {
                const file = fileInput.files[0];
                mimeType = file.type;
                imageBase64 = await new Promise(res => {
                    const r = new FileReader();
                    r.onload = () => res(r.result.split(',')[1]);
                    r.readAsDataURL(file);
                });
            }

            input.value = ''; fileInput.value = '';

            const aiContainer = document.createElement('div');
            aiContainer.className = 'mr-auto text-[#ECE9E3] p-2 max-w-[90%] text-sm space-y-2';
            
            const aiTextDiv = document.createElement('div');
            aiTextDiv.className = 'prose prose-invert flex items-center gap-2';
            
            aiTextDiv.innerHTML = `
                <div class="flex items-center gap-2 text-[#38BDF8]">
                    <svg class="animate-spin h-5 w-5 text-[#38BDF8]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-xs text-[#737068]">ATTACK AI กำลังคิด...</span>
                </div>`;
            
            aiContainer.appendChild(aiTextDiv);
            chatBox.appendChild(aiContainer);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText, mode, imageBase64, mimeType })
                });
                const data = await res.json();
                
                if (data.success) {
                    aiTextDiv.innerHTML = marked.parse(data.reply);
                    aiContainer.innerHTML += createActionToolbar(data.reply);
                    saveMessageToHistory('ai', data.reply);
                    hljs.highlightAll();
                } else {
                    aiTextDiv.innerText = "Error: " + data.error;
                }
            } catch (err) {
                aiTextDiv.innerText = "Connection Error";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        renderHistoryUI();
    </script>
</body>
</html>
