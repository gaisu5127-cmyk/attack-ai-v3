<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATTACK AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        pre { position: relative; padding-top: 2.5rem !important; border-radius: 0.75rem !important; }
        .copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; background: #383532; color: #E1DED7; border-radius: 0.375rem; cursor: pointer; transition: 0.2s; }
        .copy-btn:hover { background: #4A4744; }
    </style>
</head>
<body class="bg-[#121110] text-[#E1DED7] h-screen flex overflow-hidden antialiased">

    <!-- หน้าต่างเข้าสู่ระบบบังคับ (Fullscreen Login Wall) -->
    <div id="loginScreen" class="fixed inset-0 bg-[#000000] z-50 flex items-center justify-center p-4">
        <div class="bg-[#181716] border border-[#2A2826] p-8 rounded-3xl max-w-sm w-full space-y-6 shadow-2xl text-center">
            <!-- โลโก้ตามภาพที่แนบ -->
            <div class="flex justify-center">
                <svg class="w-20 h-20 text-white" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100 30L165 150L135 150L100 80L65 150L35 150L100 30Z" fill="white"/>
                    <path d="M100 80L120 120L100 100L80 120L100 80Z" fill="#181716"/>
                    <path d="M45 80L25 95L45 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M155 80L175 95L155 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <div>
                <h2 class="text-2xl font-bold text-white tracking-wider">ATTACK AI</h2>
                <p class="text-xs text-[#737068] mt-1">กรุณาล็อกอินเพื่อเริ่มใช้งานระบบ</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="text-xs text-[#9E9B93]">Username</label>
                    <input type="text" id="loginUser" required placeholder="กรอกชื่อผู้ใช้" class="w-full bg-[#121110] border border-[#33302D] p-3 rounded-xl text-sm text-white outline-none mt-1 focus:border-[#38BDF8] transition">
                </div>
                <div>
                    <label class="text-xs text-[#9E9B93]">Password</label>
                    <input type="password" id="loginPass" required placeholder="กรอกรหัสผ่าน" class="w-full bg-[#121110] border border-[#33302D] p-3 rounded-xl text-sm text-white outline-none mt-1 focus:border-[#38BDF8] transition">
                </div>
                <button type="submit" class="w-full py-3 bg-white text-black font-bold text-sm rounded-xl hover:bg-gray-200 transition mt-2">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Overlay สำหรับมือถือเวลาเปิด Sidebar -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-20 hidden md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-[#181716] border-r border-[#2A2826] flex flex-col justify-between transition-transform duration-300 z-30 fixed md:relative h-full -translate-x-full md:translate-x-0">
        <div class="p-5 space-y-6 overflow-y-auto no-scrollbar flex-1">
            <!-- Header Logo -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <svg class="w-7 h-7 text-white" viewBox="0 0 200 200" fill="none">
                        <path d="M100 30L165 150L135 150L100 80L65 150L35 150L100 30Z" fill="white"/>
                        <path d="M45 80L25 95L45 110" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M155 80L175 95L155 110" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h1 class="text-xl font-bold text-[#ECE9E3] tracking-wider">ATTACK AI</h1>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-[#9E9B93] hover:text-white">✕</button>
            </div>

            <!-- Menu Links -->
            <nav class="space-y-3 font-medium text-sm text-[#C2BFB7]">
                <a href="#" class="flex items-center gap-3 py-1.5 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                    Chats
                </a>
                <a href="#" class="flex items-center gap-3 py-1.5 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V7M3 7l9 6 9-6M3 7l9-6 9 6"/></svg>
                    Projects
                </a>
                <a href="#" class="flex items-center gap-3 py-1.5 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                    Code
                </a>
            </nav>

            <!-- Recents -->
            <div class="space-y-2 pt-2">
                <p class="text-xs font-semibold text-[#737068]">Recents</p>
                <div id="chatHistoryList" class="space-y-1">
                    <!-- ประวัติแชต -->
                </div>
            </div>
        </div>

        <!-- Bottom User Bar -->
        <div class="p-4 space-y-3 bg-[#141312] border-t border-[#2A2826]">
            <button onclick="createNewChat()" class="w-full py-2.5 bg-[#262422] hover:bg-[#302D2A] text-[#ECE9E3] font-medium text-sm rounded-full border border-[#383532] flex items-center justify-center gap-2 transition shadow-lg">
                <span class="text-base font-light">+</span> New chat
            </button>

            <div id="userInfo" class="flex items-center justify-between pt-1">
                <div class="flex items-center gap-2.5">
                    <div class="w-7 h-7 rounded-full bg-white flex items-center justify-center font-bold text-black text-xs" id="userAvatar">U</div>
                    <span class="text-xs font-medium text-[#ECE9E3]" id="userName">User_Guest</span>
                </div>
                <button onclick="logout()" class="text-xs text-[#737068] hover:text-white">Logout</button>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full relative">
        <!-- Top Navbar -->
        <header class="px-5 py-3 border-b border-[#2A2826] flex justify-between items-center bg-[#121110]">
            <button onclick="toggleSidebar()" class="text-[#9E9B93] hover:text-white md:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="ml-auto">
                <svg class="w-5 h-5 text-[#38BDF8]" viewBox="0 0 200 200" fill="none">
                    <path d="M100 30L165 150L135 150L100 80L65 150L35 150L100 30Z" fill="currentColor"/>
                </svg>
            </div>
        </header>

        <!-- Chat Box Output -->
        <main id="chatBox" class="flex-1 px-4 overflow-y-auto no-scrollbar flex flex-col justify-center max-w-xl mx-auto w-full space-y-6 my-auto">
            <div id="welcomeScreen" class="text-center space-y-4 py-10 my-auto">
                <!-- โลโก้หลักตรงกลางหน้า -->
                <div class="flex justify-center">
                    <svg class="w-16 h-16 text-white" viewBox="0 0 200 200" fill="none">
                        <path d="M100 30L165 150L135 150L100 80L65 150L35 150L100 30Z" fill="white"/>
                        <path d="M45 80L25 95L45 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M155 80L175 95L155 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold tracking-wider text-[#ECE9E3]" id="welcomeText">
                    Welcome to ATTACK AI
                </h2>
            </div>
        </main>

        <!-- Footer Input Area -->
        <footer class="p-4 bg-[#121110] max-w-xl mx-auto w-full space-y-3">
            <div class="bg-[#1C1B1A] border border-[#2A2826] rounded-2xl p-2.5 shadow-2xl space-y-2">
                <form id="chatForm" class="flex items-center gap-2">
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                    <button type="button" onclick="document.getElementById('imageInput').click()" class="w-9 h-9 flex items-center justify-center bg-[#262422] hover:bg-[#302D2A] text-[#E1DED7] rounded-full transition text-lg font-light">
                        +
                    </button>

                    <div class="relative flex-1">
                        <select id="mode" class="w-full appearance-none bg-[#262422] text-[#E1DED7] text-xs font-medium px-3 py-2 rounded-full border border-[#33302D] outline-none cursor-pointer pr-6">
                            <option value="normal">ATTACK AI Mode</option>
                            <option value="expert">Senior Dev Mode</option>
                            <option value="dumb">Raw Mode</option>
                        </select>
                    </div>

                    <button type="submit" class="w-9 h-9 flex items-center justify-center bg-[#ECE9E3] text-[#121110] hover:opacity-90 rounded-full transition">
                        ↑
                    </button>
                </form>

                <div class="px-1 pt-1">
                    <input type="text" id="userInput" placeholder="Chat with ATTACK AI..." class="w-full bg-transparent text-sm text-[#ECE9E3] outline-none placeholder-[#737068]">
                </div>
            </div>
        </footer>
    </div>

    <script>
        let chatHistory = JSON.parse(localStorage.getItem('attack_ai_history') || '[]');
        let currentChatId = Date.now();

        marked.setOptions({
            highlight: function(code) { return hljs.highlightAuto(code).value; }
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }

        // ระบบล็อกอินบังคับ
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value;
            
            document.getElementById('userName').innerText = username;
            document.getElementById('userAvatar').innerText = username[0].toUpperCase();
            document.getElementById('welcomeText').innerText = `Welcome, ${username}`;
            
            // ปิดหน้าจอ Login
            document.getElementById('loginScreen').style.display = 'none';
        }

        function logout() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
        }

        function createNewChat() {
            currentChatId = Date.now();
            const chatBox = document.getElementById('chatBox');
            chatBox.classList.add('justify-center', 'my-auto');
            chatBox.innerHTML = `
                <div id="welcomeScreen" class="text-center space-y-4 py-10 my-auto">
                    <div class="flex justify-center">
                        <svg class="w-16 h-16 text-white" viewBox="0 0 200 200" fill="none">
                            <path d="M100 30L165 150L135 150L100 80L65 150L35 150L100 30Z" fill="white"/>
                            <path d="M45 80L25 95L45 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M155 80L175 95L155 110" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h2 class="text-3xl font-bold tracking-wider text-[#ECE9E3]">
                        Welcome to ATTACK AI
                    </h2>
                </div>`;
            renderHistoryUI();
        }

        function addCopyButtons() {
            document.querySelectorAll('pre').forEach((pre) => {
                if (pre.querySelector('.copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.innerText = 'Copy Code';
                btn.onclick = () => {
                    const code = pre.querySelector('code')?.innerText || pre.innerText;
                    navigator.clipboard.writeText(code);
                    btn.innerText = 'Copied!';
                    setTimeout(() => btn.innerText = 'Copy Code', 2000);
                };
                pre.appendChild(btn);
            });
        }

        function saveHistory(firstUserMsg) {
            let chat = chatHistory.find(c => c.id === currentChatId);
            if (!chat) {
                chat = { id: currentChatId, title: firstUserMsg.slice(0, 25) };
                chatHistory.unshift(chat);
                localStorage.setItem('attack_ai_history', JSON.stringify(chatHistory));
            }
            renderHistoryUI();
        }

        function renderHistoryUI() {
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = chatHistory.map(c => `
                <div onclick="loadChat(${c.id})" class="p-2 text-sm rounded-lg hover:bg-[#262422] cursor-pointer text-[#C2BFB7] hover:text-white truncate transition">
                    ${c.title}
                </div>
            `).join('');
        }

        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const fileInput = document.getElementById('imageInput');
            const mode = document.getElementById('mode').value;
            const chatBox = document.getElementById('chatBox');
            const welcomeScreen = document.getElementById('welcomeScreen');

            if (!input.value && !fileInput.files[0]) return;

            if (welcomeScreen) {
                welcomeScreen.remove();
                chatBox.classList.remove('justify-center', 'my-auto');
            }

            const userText = input.value;
            saveHistory(userText || 'Image Attachment');

            const userDiv = document.createElement('div');
            userDiv.className = 'ml-auto bg-[#262422] text-[#ECE9E3] p-4 rounded-2xl max-w-[85%] text-sm border border-[#33302D] shadow';
            userDiv.innerText = userText || '[Image]';
            chatBox.appendChild(userDiv);

            let imageBase64 = null, mimeType = null;
            if (fileInput.files[0]) {
                const file = fileInput.files[0];
                mimeType = file.type;
                imageBase64 = await new Promise(res => {
                    const r = new FileReader();
                    r.onload = () => res(r.result.split(',')[1]);
                    r.readAsDataURL(file);
                });
            }

            input.value = ''; fileInput.value = '';

            const aiDiv = document.createElement('div');
            aiDiv.className = 'mr-auto text-[#ECE9E3] p-2 max-w-[90%] text-sm prose prose-invert';
            aiDiv.innerHTML = '<span class="text-[#737068] animate-pulse">Thinking...</span>';
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText, mode, imageBase64, mimeType })
                });
                const data = await res.json();
                
                if (data.success) {
                    aiDiv.innerHTML = marked.parse(data.reply);
                    hljs.highlightAll();
                    addCopyButtons();
                } else {
                    aiDiv.innerText = "Error: " + data.error;
                }
            } catch (err) {
                aiDiv.innerText = "Connection Error";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        renderHistoryUI();
    </script>
</body>
</html>
