<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATTACK AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        pre { position: relative; padding-top: 2.5rem !important; border-radius: 0.75rem !important; }
        .copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.75rem; background: #383532; color: #E1DED7; border-radius: 0.375rem; cursor: pointer; transition: 0.2s; }
        .copy-btn:hover { background: #4A4744; }
    </style>
</head>
<body class="bg-[#121110] text-[#E1DED7] h-screen flex overflow-hidden antialiased">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-[#181716] border-r border-[#2A2826] flex flex-col justify-between transition-all duration-300 z-20 absolute md:relative h-full -translate-x-full md:translate-x-0">
        <div class="p-4 space-y-4">
            <button onclick="createNewChat()" class="w-full py-2.5 px-4 bg-[#262422] hover:bg-[#302D2A] text-[#ECE9E3] font-medium text-sm rounded-xl border border-[#383532] flex items-center justify-center gap-2 transition shadow">
                + New Chat
            </button>

            <div class="space-y-1">
                <p class="text-xs font-semibold text-[#737068] px-2 uppercase tracking-wider">History</p>
                <div id="chatHistoryList" class="space-y-1 max-h-[65vh] overflow-y-auto no-scrollbar">
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-[#2A2826] bg-[#141312]">
            <div id="userInfo" class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-[#D97757] flex items-center justify-center font-bold text-black text-xs" id="userAvatar">U</div>
                    <div>
                        <p class="text-xs font-semibold text-white" id="userName">User_Guest</p>
                        <p class="text-[10px] text-[#737068]" id="userStatus">Account</p>
                    </div>
                </div>
                <button onclick="toggleAuthModal()" class="text-xs text-[#D97757] hover:underline">Sign In</button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full relative">
        <header class="px-5 py-3 border-b border-[#2A2826] flex justify-between items-center bg-[#121110]">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-[#9E9B93] hover:text-white md:hidden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="font-bold text-lg text-[#ECE9E3] tracking-wide">ATTACK <span class="text-[#D97757]">AI</span></h1>
            </div>
            
            <select id="mode" class="bg-[#1C1B1A] text-[#E1DED7] text-xs font-medium px-3 py-1.5 rounded-lg border border-[#33302D] outline-none cursor-pointer">
                <option value="normal">Normal Mode</option>
                <option value="expert">Senior Dev Mode</option>
                <option value="dumb">Raw Mode</option>
            </select>
        </header>

        <main id="chatBox" class="flex-1 px-4 py-6 overflow-y-auto no-scrollbar space-y-6 max-w-3xl mx-auto w-full">
            <div id="welcomeScreen" class="text-center space-y-3 my-auto py-20">
                <h2 class="text-2xl font-bold text-[#ECE9E3]">ATTACK AI</h2>
                <p class="text-xs text-[#737068]">System ready. Enter your instruction below.</p>
            </div>
        </main>

        <footer class="p-4 bg-[#121110] max-w-3xl mx-auto w-full">
            <div class="bg-[#1C1B1A] border border-[#2A2826] rounded-2xl p-2.5 shadow-2xl space-y-2">
                <form id="chatForm" class="flex items-center gap-2">
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                    <button type="button" onclick="document.getElementById('imageInput').click()" class="w-9 h-9 flex items-center justify-center bg-[#262422] hover:bg-[#302D2A] text-[#E1DED7] rounded-full transition text-base">
                        +
                    </button>

                    <input type="text" id="userInput" placeholder="Message ATTACK AI..." class="flex-1 bg-transparent text-sm text-[#ECE9E3] outline-none placeholder-[#737068] px-2">

                    <button type="submit" class="w-9 h-9 flex items-center justify-center bg-[#D97757] text-black font-bold hover:opacity-90 rounded-full transition">
                        &rarr;
                    </button>
                </form>
            </div>
        </footer>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#1C1B1A] border border-[#33302D] p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white text-center">Sign In</h3>
            <div class="space-y-3">
                <input type="text" id="authName" placeholder="Username" class="w-full bg-[#121110] border border-[#33302D] p-2.5 rounded-xl text-sm text-white outline-none">
                <button onclick="loginUser()" class="w-full py-2.5 bg-[#D97757] text-black font-bold text-sm rounded-xl hover:opacity-90 transition">Save User</button>
                <button onclick="toggleAuthModal()" class="w-full py-2 bg-transparent text-[#737068] text-xs hover:text-white">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let chatHistory = JSON.parse(localStorage.getItem('attack_ai_history') || '[]');
        let currentChatId = Date.now();

        marked.setOptions({
            highlight: function(code) { return hljs.highlightAuto(code).value; }
        });

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function toggleAuthModal() { 
            const modal = document.getElementById('authModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        function loginUser() {
            const name = document.getElementById('authName').value || 'User_VIP';
            document.getElementById('userName').innerText = name;
            document.getElementById('userAvatar').innerText = name[0].toUpperCase();
            document.getElementById('userStatus').innerText = 'Active';
            toggleAuthModal();
        }

        function createNewChat() {
            currentChatId = Date.now();
            document.getElementById('chatBox').innerHTML = `
                <div id="welcomeScreen" class="text-center space-y-3 my-auto py-20">
                    <h2 class="text-2xl font-bold text-[#ECE9E3]">ATTACK AI</h2>
                    <p class="text-xs text-[#737068]">System ready. Enter your instruction below.</p>
                </div>`;
            renderHistoryUI();
        }

        function addCopyButtons() {
            document.querySelectorAll('pre').forEach((pre) => {
                if (pre.querySelector('.copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.innerText = 'Copy Code';
                btn.onclick = () => {
                    const code = pre.querySelector('code')?.innerText || pre.innerText;
                    navigator.clipboard.writeText(code);
                    btn.innerText = 'Copied!';
                    setTimeout(() => btn.innerText = 'Copy Code', 2000);
                };
                pre.appendChild(btn);
            });
        }

        function saveHistory(firstUserMsg) {
            let chat = chatHistory.find(c => c.id === currentChatId);
            if (!chat) {
                chat = { id: currentChatId, title: firstUserMsg.slice(0, 20) + '...' };
                chatHistory.unshift(chat);
                localStorage.setItem('attack_ai_history', JSON.stringify(chatHistory));
            }
            renderHistoryUI();
        }

        function renderHistoryUI() {
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = chatHistory.map(c => `
                <div onclick="loadChat(${c.id})" class="p-2 text-xs rounded-lg hover:bg-[#262422] cursor-pointer text-[#E1DED7] truncate border border-transparent hover:border-[#383532]">
                    ${c.title}
                </div>
            `).join('');
        }

        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const fileInput = document.getElementById('imageInput');
            const mode = document.getElementById('mode').value;
            const chatBox = document.getElementById('chatBox');
            const welcomeScreen = document.getElementById('welcomeScreen');

            if (!input.value && !fileInput.files[0]) return;
            if (welcomeScreen) welcomeScreen.remove();

            const userText = input.value;
            saveHistory(userText || 'Image Attachment');

            const userDiv = document.createElement('div');
            userDiv.className = 'ml-auto bg-[#262422] text-[#ECE9E3] p-3.5 rounded-2xl max-w-[85%] text-sm border border-[#33302D] shadow';
            userDiv.innerText = userText || '[Image]';
            chatBox.appendChild(userDiv);

            let imageBase64 = null, mimeType = null;
            if (fileInput.files[0]) {
                const file = fileInput.files[0];
                mimeType = file.type;
                imageBase64 = await new Promise(res => {
                    const r = new FileReader();
                    r.onload = () => res(r.result.split(',')[1]);
                    r.readAsDataURL(file);
                });
            }

            input.value = ''; fileInput.value = '';

            const aiDiv = document.createElement('div');
            aiDiv.className = 'mr-auto text-[#ECE9E3] p-2 max-w-[90%] text-sm prose prose-invert';
            aiDiv.innerHTML = '<span class="text-[#D97757] animate-pulse">Thinking...</span>';
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText, mode, imageBase64, mimeType })
                });
                const data = await res.json();
                
                if (data.success) {
                    aiDiv.innerHTML = marked.parse(data.reply);
                    hljs.highlightAll();
                    addCopyButtons();
                } else {
                    aiDiv.innerText = "Error: " + data.error;
                }
            } catch (err) {
                aiDiv.innerText = "Connection Error";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        renderHistoryUI();
    </script>
</body>
</html>
